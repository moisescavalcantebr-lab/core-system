# Template only. Mount after installing a certificate for meuprojetoweb.com.
<VirtualHost *:443>
    ServerName meuprojetoweb.com
    DocumentRoot /var/www/html
    SSLEngine on
    SSLCertificateFile /run/mail-center/tls/fullchain.pem
    SSLCertificateKeyFile /run/mail-center/tls/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined env=!mail_oauth_callback
    CustomLog ${APACHE_LOG_DIR}/access.log mail_callback_safe env=mail_oauth_callback
</VirtualHost>
