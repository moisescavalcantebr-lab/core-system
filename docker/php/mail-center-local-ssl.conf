# Development only. Loaded explicitly by docker-compose.mail-center.local.yml.
<VirtualHost *:80>
    ServerName localhost
    Redirect 302 / https://localhost:8443/
    CustomLog ${APACHE_LOG_DIR}/access.log combined env=!mail_oauth_callback
    CustomLog ${APACHE_LOG_DIR}/access.log mail_callback_safe env=mail_oauth_callback
</VirtualHost>
<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html
    SSLEngine on
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCertificateFile /run/mail-center-tls/localhost.crt
    SSLCertificateKeyFile /run/mail-center-tls/localhost.key
    CustomLog ${APACHE_LOG_DIR}/access.log combined env=!mail_oauth_callback
    CustomLog ${APACHE_LOG_DIR}/access.log mail_callback_safe env=mail_oauth_callback
</VirtualHost>
